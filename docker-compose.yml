version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    # For local dev you can still use a .env, but secrets are preferred.
    env_file:
      - ./.env
    volumes:
      - ./backend:/app/backend
      - ./frontend/src/locales:/app/frontend/src/locales
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import sys, urllib.request as u; r=u.urlopen(\"http://127.0.0.1:8000/health\"); sys.exit(0 if r.getcode()==200 else 1)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - app-network
    secrets:
      - OPENAI_API_KEY
      - LINGO_API_KEY
      - GROQ_API_KEY
      - LINGO_PROJECT_ID

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    ports:
      - "8501:8501"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY:-demo}
      - LINGO_API_KEY=${LINGO_API_KEY:-demo}
      - LINGO_PROJECT_ID=${LINGO_PROJECT_ID:-demo}
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  app-data:

secrets:
  OPENAI_API_KEY:
    file: ./backend/.secrets/OPENAI_API_KEY
  LINGO_API_KEY:
    file: ./backend/.secrets/LINGO_API_KEY
  GROQ_API_KEY:
    file: ./backend/.secrets/GROQ_API_KEY
  LINGO_PROJECT_ID:
    file: ./backend/.secrets/LINGO_PROJECT_ID
